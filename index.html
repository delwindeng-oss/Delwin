<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>时间工具合集</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: system-ui, sans-serif;
        }
        body {
            max-width: 520px;
            margin: 30px auto;
            padding: 0 20px;
            background-color: #f7f8fa;
        }
        .card {
            background: #fff;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }
        h3 {
            margin-top: 0;
            color: #222;
        }
        .item {
            margin: 14px 0;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 500;
            font-size: 14px;
        }
        input {
            width: 100%;
            padding: 10px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }
        .btn-group {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin:10px 0;
        }
        button {
            padding: 8px 12px;
            border: none;
            background: #4080ff;
            color: white;
            border-radius: 6px;
            cursor: pointer;
            font-size:14px;
        }
        button.quick {
            background:#6699ff;
        }
        button:hover {
            background:#2b6ed9;
        }
        .result {
            margin-top:12px;
            padding:10px;
            background:#eef6ff;
            border-radius:6px;
            font-size:16px;
        }
    </style>
</head>
<body>
    <!-- 功能1：起始时间 + 分钟 求结束时间 -->
    <div class="card">
        <h3>✅ 时间加法（加分钟）</h3>
        <div class="item">
            <label>起始时间</label>
            <input type="datetime-local" id="startTime">
        </div>
        <div class="item">
            <label>增加分钟</label>
            <input type="number" id="addMin" placeholder="输入分钟">
        </div>
        <div class="btn-group">
            <button class="quick" onclick="setMin(360)">+360分钟</button>
            <button class="quick" onclick="setMin(250)">+250分钟</button>
            <button class="quick" onclick="setMin(999)">+999分钟</button>
            <button onclick="calcAdd()">计算</button>
        </div>
        <div class="result" id="addResult"></div>
    </div>

    <!-- 功能2：挂机时长计算器 -->
    <div class="card">
        <h3>⏱️ 挂机时长计算</h3>
        <div class="item">
            <label>开始时间</label>
            <input type="datetime-local" id="idleStart">
        </div>
        <div class="item">
            <label>结束时间</label>
            <input type="datetime-local" id="idleEnd">
        </div>
        <div class="btn-group">
            <button class="quick" onclick="setIdleEndNow14()">今天14:00</button>
            <button class="quick" onclick="setIdleEndNight19()">今晚19:00</button>
            <button class="quick" onclick="setIdleEndTom730()">明早 07:30</button>
            <button class="quick" onclick="setIdleEndTom14()">明天14:00</button>
            <button onclick="calcIdle()">计算时长</button>
        </div>
        <div class="result" id="idleResult"></div>
    </div>

<script>
// 页面加载默认当前时间
function getLocalDatetime() {
    const d = new Date();
    const offset = d.getTimezoneOffset() * 60000;
    const localISOTime = (new Date(d - offset)).toISOString().slice(0, 16);
    return localISOTime;
}
document.getElementById('startTime').value = getLocalDatetime();
document.getElementById('idleStart').value = getLocalDatetime();

// 加分钟工具
function setMin(v) {
    document.getElementById('addMin').value = v;
}
function calcAdd() {
    const st = document.getElementById('startTime').value;
    const m = Number(document.getElementById('addMin').value);
    if(!st || isNaN(m)){
        document.getElementById('addResult').innerText="请填写时间和分钟";
        return;
    }
    const t = new Date(st);
    t.setMinutes(t.getMinutes() + m);
    document.getElementById('addResult').innerText = "结果：" + formatDT(t);
}

// 挂机时长
function calcIdle(){
    const s = new Date(document.getElementById('idleStart').value);
    const e = new Date(document.getElementById('idleEnd').value);
    if(isNaN(s.getTime()) || isNaN(e.getTime())){
        document.getElementById('idleResult').innerText="时间不合法";
        return;
    }
    const diff = (e - s)/60000;
    const h = Math.floor(diff / 60);
    const min = Math.round(diff % 60);
    document.getElementById('idleResult').innerText = `相差：${h}小时 ${min}分钟（合计 ${diff.toFixed(1)} 分钟）`;
}

// ====== 快捷按钮 ======
// 今天14:00
function setIdleEndNow14(){
    const d = new Date();
    d.setHours(14,0,0,0);
    document.getElementById('idleEnd').value = toDTLocal(d);
}
// 今晚19:00
function setIdleEndNight19(){
    const d = new Date();
    d.setHours(19,0,0,0);
    document.getElementById('idleEnd').value = toDTLocal(d);
}
// 明早 07:30
function setIdleEndTom730(){
    const d = new Date();
    d.setDate(d.getDate()+1);
    d.setHours(7,30,0,0);
    document.getElementById('idleEnd').value = toDTLocal(d);
}
// 明天14:00
function setIdleEndTom14(){
    const d = new Date();
    d.setDate(d.getDate()+1);
    d.setHours(14,0,0,0);
    document.getElementById('idleEnd').value = toDTLocal(d);
}

// 辅助格式化
function formatDT(date){
    const y = date.getFullYear();
    const M = String(date.getMonth()+1).padStart(2,'0');
    const day = String(date.getDate()).padStart(2,'0');
    const h = String(date.getHours()).padStart(2,'0');
    const m = String(date.getMinutes()).padStart(2,'0');
    return `${y}-${M}-${day} ${h}:${m}`;
}
function toDTLocal(date){
    const offset = date.getTimezoneOffset() * 60000;
    return (new Date(date - offset)).toISOString().slice(0,16);
}
</script>
</body>
</html>
