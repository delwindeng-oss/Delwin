<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>时间工具合集</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: system-ui, sans-serif;
        }
        body {
            max-width: 480px;
            margin: 20px auto;
            padding: 0 20px;
            background:#ffffff;
        }
        .block{
            margin:30px 0;
            padding:20px;
            border:1px solid #e5e7eb;
            border-radius:10px;
        }
        h3{
            margin-top:0;
        }
        .item {
            margin: 16px 0;
        }
        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 500;
        }
        input {
            width: 100%;
            padding: 10px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }
        button {
            width: 100%;
            padding: 12px;
            border: none;
            background: #2563eb;
            color: white;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
        }
        button:active {
            background: #1d4ed8;
        }
        .result {
            margin-top: 16px;
            padding: 14px;
            background: #f0f7ff;
            border-radius: 6px;
            font-size: 17px;
            white-space: pre-wrap;
        }
        .quick-btn-group{
            display:flex;
            gap:8px;
            margin-top:8px;
        }
        .quick-btn-group button{
            flex:1;
            padding:8px 4px;
            font-size:14px;
            background:#64748b;
        }
        .quick-btn-group button:active{
            background:#475569;
        }
        .short-cut-group{
            display:flex;
            flex-wrap:wrap;
            gap:6px;
            margin:8px 0 16px;
        }
        .short-cut-group button{
            flex:none;
            width:auto;
            padding:6px 10px;
            font-size:14px;
            background:#475569;
        }
    </style>
</head>
<body>
    <h2>时间工具合集</h2>

    <!--功能1：时间加分钟-->
    <div class="block">
        <h3>① 起始时间 + 分钟 → 结束时间</h3>
        <div class="item">
            <label>起始时间</label>
            <input type="time" id="startTime">
        </div>
        <div class="item">
            <label>增加分钟数</label>
            <input type="number" id="addMinute" placeholder="例如：90" value="60">
            <div class="quick-btn-group">
                <button onclick="setMinute(360)">360分钟</button>
                <button onclick="setMinute(250)">250分钟</button>
                <button onclick="setMinute(999)">999分钟</button>
            </div>
        </div>
        <button onclick="calcTime()">计算结束时间</button>
        <div class="result" id="resultAdd"></div>
    </div>

    <!--功能2：挂机时间计算器（带日期）-->
    <div class="block">
        <h3>② ⏱️ 挂机时间计算器</h3>
        <div class="item">
            <label>开始时间（默认现在，可修改）</label>
            <input type="datetime-local" id="idleStart">
        </div>
        <div class="item">
            <label>挂机到（目标结束时间）</label>
            <input type="datetime-local" id="idleEnd">
        </div>
        <div class="short-cut-group">
            <button onclick="setShortcut('today24')">今天 24:00</button>
            <button onclick="setShortcut('tom08')">明早 08:00</button>
            <button onclick="setShortcut('tom12')">明午 12:00</button>
            <button onclick="setShortcut('tom14')">明天14:00</button>
        </div>
        <button onclick="calcIdle()">计算挂机时长</button>
        <div class="result" id="resultIdle"></div>
    </div>

<script>
// 获取本地时间，datetime‑local格式 yyyy‑MM‑ddThh:mm
function getNowDateTimeLocal(){
    const d = new Date();
    const year = d.getFullYear();
    const mon = String(d.getMonth()+1).padStart(2,'0');
    const day = String(d.getDate()).padStart(2,'0');
    const hh = String(d.getHours()).padStart(2,'0');
    const mm = String(d.getMinutes()).padStart(2,'0');
    return `${year}-${mon}-${day}T${hh}:${mm}`;
}

// 获取时分字符串（用于第一个模块）
function getNowTimeStr(){
    const now = new Date();
    const hh = String(now.getHours()).padStart(2,'0');
    const mm = String(now.getMinutes()).padStart(2,'0');
    return `${hh}:${mm}`;
}

window.onload = function(){
    document.getElementById('startTime').value = getNowTimeStr();
    document.getElementById('idleStart').value = getNowDateTimeLocal();
    document.getElementById('idleEnd').value = getNowDateTimeLocal();
};

// ========== 功能1：时间加分钟 ==========
function setMinute(val){
    document.getElementById('addMinute').value = val;
}

function calcTime() {
    const timeStr = document.getElementById('startTime').value;
    const addMin = Number(document.getElementById('addMinute').value);
    if (!timeStr || isNaN(addMin)) {
        document.getElementById('resultAdd').innerText = "请输入正确的时间和分钟";
        return;
    }
    const [h, m] = timeStr.split(':').map(Number);
    let total = h * 60 + m + addMin;
    total = total % (24 * 60);
    const endH = Math.floor(total / 60);
    const endM = total % 60;
    const fmt = (n) => String(n).padStart(2, '0');
    const endTime = `${fmt(endH)}:${fmt(endM)}`;
    document.getElementById('resultAdd').innerText = `结束时间：${endTime}`;
}

// ========== 功能2 挂机计算器 ==========
// 设置快捷结束时间
function setShortcut(mode){
    let end = new Date();
    if(mode === 'today24'){
        //今天24点 = 次日0点
        end.setDate(end.getDate()+1);
        end.setHours(0,0,0,0);
    }else if(mode === 'tom08'){
        end.setDate(end.getDate()+1);
        end.setHours(8,0,0,0);
    }else if(mode === 'tom12'){
        end.setDate(end.getDate()+1);
        end.setHours(12,0,0,0);
    }else if(mode === 'tom14'){
        end.setDate(end.getDate()+1);
        end.setHours(14,0,0,0);
    }
    const y = end.getFullYear();
    const mo = String(end.getMonth()+1).padStart(2,'0');
    const d = String(end.getDate()).padStart(2,'0');
    const h = String(end.getHours()).padStart(2,'0');
    const mi = String(end.getMinutes()).padStart(2,'0');
    document.getElementById('idleEnd').value = `${y}-${mo}-${d}T${h}:${mi}`;
}

function calcIdle(){
    const sVal = document.getElementById('idleStart').value;
    const eVal = document.getElementById('idleEnd').value;
    if(!sVal || !eVal){
        document.getElementById('resultIdle').innerText = "请填写开始与结束时间";
        return;
    }
    const start = new Date(sVal);
    const end = new Date(eVal);
    if(end <= start){
        document.getElementById('resultIdle').innerText = "⚠️结束时间不能早于或等于开始时间，请检查！";
        return;
    }
    const diffMs = end.getTime() - start.getTime();
    const totalMin = Math.floor(diffMs / 60000);
    const hours = Math.floor(totalMin / 60);
    const mins = totalMin % 60;

    const fmtDate = (dt)=>{
        const m = dt.getMonth()+1;
        const day = dt.getDate();
        const hh = String(dt.getHours()).padStart(2,'0');
        const mm = String(dt.getMinutes()).padStart(2,'0');
        return `${m}月${day}日 ${hh}:${mm}`;
    };

    const out = `${hours}小时${mins}分
从 ${fmtDate(start)} 挂到 ${fmtDate(end)}
共 ${totalMin} 分钟`;
    document.getElementById('resultIdle').innerText = out;
}

</script>
</body>
</html>
